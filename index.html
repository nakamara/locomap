<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ロケ進行">
<meta name="theme-color" content="#ffffff">
<title>ロケ進行マップ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--sub:#5b6270;--line:#dfe2e8;
  --accent:#e5482d;--next:#f29d0b;--done:#9aa1ad;--todo:#2f6fed;--ok:#1f9d55;--warn:#d6336c;
  --r:12px;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:40px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.danger{color:var(--warn);border-color:#f3c2d2}
button:disabled{opacity:.4}
a.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:40px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}

header{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px);background:#fff;border-bottom:1px solid var(--line)}
header .ttl{flex:1;min-width:0}
header .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
header .ttl small{color:var(--sub);font-size:12px}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
#syncDot{width:10px;height:10px;border-radius:50%;background:var(--done);flex:none}
#syncDot.ok{background:var(--ok)} #syncDot.err{background:var(--warn)} #syncDot.busy{background:var(--next)}
header button{padding:6px 10px;min-height:36px}

#main{flex:1;display:flex;min-height:0}
#mapWrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#e9ecef}
#side{width:420px;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg)}
@media (max-width:820px),(orientation:portrait){
  #main{flex-direction:column}
  #mapWrap{flex:0 0 40%}
  #side{width:auto;flex:1;border-left:0;border-top:1px solid var(--line)}
}
.mapBtns{position:absolute;right:calc(var(--sr) + 10px);bottom:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapBtns button{box-shadow:0 1px 4px rgba(0,0,0,.2);min-width:44px;font-size:13px}
.mapBtns button.on{background:var(--todo);color:#fff;border-color:var(--todo)}
#pickBanner{position:absolute;left:10px;right:10px;top:10px;z-index:600;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;display:none;align-items:center;gap:8px}
#pickBanner.show{display:flex}
#pickBanner span{flex:1}
#pickRef img{height:64px;border-radius:6px}
#pickBanner button{color:var(--ink);flex:none}
#pickRef:empty{display:none}

#status{padding:10px calc(var(--sr) + 10px) 6px calc(var(--sl) + 10px)}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:12px}
.nowCard{border-left:5px solid var(--accent)}
.nowCard .lbl,.nextCard .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent)}
.nextCard{border-left:5px solid var(--next);margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 12px}
.nextCard .lbl{color:var(--next)}
.nextCard .grow{flex:1;min-width:0}
.big{font-size:18px;font-weight:700;margin:2px 0}
.subl{color:var(--sub);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;background:#eef1f5;color:var(--sub)}
.pill.late{background:#fde4ec;color:var(--warn)} .pill.on{background:#e3f6ea;color:var(--ok)} .pill.wait{background:#e8effd;color:var(--todo)}
.btnRow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btnRow>*{flex:1}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dateWarn{background:#fff4e0;color:#8a5a00;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:8px}

#listHead{display:flex;align-items:center;gap:8px;padding:6px calc(var(--sr) + 12px) 6px calc(var(--sl) + 12px);font-size:12px;color:var(--sub)}
#listHead .grow{flex:1}
#list{flex:1;overflow:auto;padding:0 calc(var(--sr) + 10px) calc(var(--sb) + 16px) calc(var(--sl) + 10px);margin:0;list-style:none;-webkit-overflow-scrolling:touch}
.stop{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:6px}
.stop .chk{flex:none;width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;font-weight:700;color:#fff;background:#fff;border:2px solid var(--line)}
.stop.done .chk{background:var(--ok);border-color:var(--ok)}
.stop .tm{flex:none;width:48px;font-variant-numeric:tabular-nums;font-weight:700}
.stop .tm small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.stop .bd{flex:1;min-width:0}
.stop .bd b{display:block}
.stop .num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;font-size:11px;color:#fff;background:var(--todo);margin-right:4px;padding:0 5px;vertical-align:1px}
.stop.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(229,72,45,.15)} .stop.active .num{background:var(--accent)}
.stop.next .num{background:var(--next)}
.stop.done{opacity:.6} .stop.done .num{background:var(--done)}
.stop img.th{flex:none;width:56px;height:42px;object-fit:cover;border-radius:6px;background:#eee}
.stop .ed{display:flex;flex-direction:column;gap:4px}
.stop .ed button{min-height:30px;padding:3px 8px;font-size:12px}
.nogeo{color:var(--warn);font-size:12px}
.empty{color:var(--sub);text-align:center;padding:30px 10px}

/* markers */
.mk{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--todo);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:12px}
.mk.active{background:var(--accent);width:38px;height:38px} .mk.active span{font-size:15px}
.mk.next{background:var(--next);width:34px;height:34px}
.mk.done{background:var(--done)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}

/* modal */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(10,12,16,.45);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:821px){.modal{align-items:center}.sheet{border-radius:16px;max-height:88dvh}}
.sheet>.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.sheet>.hd b{flex:1;font-size:16px}
.sheet>.bd{overflow:auto;padding:12px 14px calc(var(--sb) + 18px)}
.imgs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.imgs img{height:200px;max-width:90%;border-radius:10px;scroll-snap-align:start;background:#ddd;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.grid .it{position:relative}
.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#ddd;display:block}
.grid .it button{position:absolute;top:4px;right:4px;min-height:0;padding:2px 7px;border-radius:50%;font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.results{margin-top:6px}
.results button{display:block;width:100%;text-align:left;margin-bottom:4px;font-size:13px}
#dPrev,#dNext{min-width:40px;font-size:20px;line-height:1;padding:4px 8px}
#dPos{font-variant-numeric:tabular-nums;white-space:nowrap}
.logs{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.logs h4{margin:0 0 6px;font-size:14px}
.log{border-top:1px solid var(--line);padding:8px 0}
.log:first-of-type{border-top:0}
.log .lh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.log .lh span{flex:1}
.log .lh button{min-height:28px;padding:2px 8px;font-size:12px}
.log .lt{white-space:pre-wrap;margin-top:2px}
.logAdd textarea{min-height:64px;margin-top:6px}
.slideL{animation:slideL .18s ease-out}.slideR{animation:slideR .18s ease-out}
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.memo{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 8px;font-size:14px;margin-top:8px}
.kv dt{color:var(--sub)} .kv dd{margin:0}
.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.section h4{margin:0 0 4px;font-size:14px}
.hint{font-size:12px;color:var(--sub);margin-top:6px}

/* viewer */
/* PDF viewer */
#pdfv{position:fixed;inset:0;z-index:2600;background:#3b3e44;display:none;flex-direction:column}
#pdfv.show{display:flex}
#pdfv .bar{display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 8px calc(var(--sl) + 10px);background:#fff;border-bottom:1px solid var(--line)}
#pdfv .bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#pdfv .bar button{min-height:36px;padding:6px 10px}
#pvPage{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;white-space:nowrap}
#pvScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#pvPages{position:relative;padding:8px 8px calc(var(--sb) + 24px);transform-origin:0 0;width:max-content;min-width:100%}
.pvPage{background:#fff;margin:0 auto 8px;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pvPage canvas{display:block;width:100%;height:100%}
.pvMsg{color:#fff;text-align:center;padding:40px 16px}
#viewer{position:fixed;inset:0;z-index:3000;background:#000;display:none;overflow:auto}
#viewer.show{display:block}
#viewer img{display:block;width:100%;height:100%;object-fit:contain}
#viewer.zoom img{width:250%;height:auto;max-width:none}
#viewer .x{position:fixed;top:calc(var(--st) + 10px);right:12px;z-index:1;background:rgba(255,255,255,.9)}

/* pdf */
.pages{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.pages button{flex:none;padding:4px;min-height:0}
.pages button.on{border-color:var(--accent);border-width:2px}
.pages canvas{display:block;height:80px}
.cropWrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;margin-top:8px;background:#ddd}
.cropWrap canvas{display:block;width:100%;height:auto}
.cropRect{position:absolute;border:2px solid var(--accent);background:rgba(229,72,45,.12);pointer-events:none;display:none}
.draft{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.draft input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px}
.draft input[type=text]{padding:5px 8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:4000;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div id="syncDot" title="同期状態"></div>
  <div class="ttl"><b id="hTitle">ロケ進行マップ</b><small id="hSub"></small></div>
  <div id="clock">--:--</div>
  <button id="btnPdf" hidden>香盤表</button>
  <button id="btnEdit">編集</button>
  <button id="btnSettings">設定</button>
</header>
<div id="main">
  <div id="mapWrap">
    <div id="map"></div>
    <div id="pickBanner"><div style="flex:1;min-width:0"><div>地図をタップして位置を指定</div><div id="pickRef" class="imgs" style="margin-top:6px"></div></div><button id="pickCancel">取消</button></div>
    <div class="mapBtns">
      <button id="btnGps">現在地</button>
      <button id="btnFit">全体</button>
    </div>
  </div>
  <div id="side">
    <div id="status"></div>
    <div id="listHead"><span class="grow" id="progress"></span><span id="editTools"></span></div>
    <ul id="list"></ul>
  </div>
</div>

<!-- detail -->
<div class="modal" id="mDetail"><div class="sheet"><div class="hd"><button id="dPrev" aria-label="前の項目">‹</button><b id="dTitle" class="ellip"></b><span id="dPos" class="subl"></span><button id="dNext" aria-label="次の項目">›</button><button data-close>閉じる</button></div><div class="bd" id="dBody"></div></div></div>
<!-- edit -->
<div class="modal" id="mEdit"><div class="sheet"><div class="hd"><b>地点の編集</b><button data-close>取消</button><button class="primary" id="eSave">保存</button></div><div class="bd" id="eBody"></div></div></div>
<!-- pdf -->
<div class="modal" id="mPdf"><div class="sheet"><div class="hd"><b>香盤表PDFから取り込み</b><button data-close>閉じる</button></div><div class="bd" id="pBody"></div></div></div>
<!-- settings -->
<div class="modal" id="mSet"><div class="sheet"><div class="hd"><b>設定</b><button data-close>閉じる</button></div><div class="bd" id="sBody"></div></div></div>
<!-- confirm -->
<div class="modal" id="mConfirm"><div class="sheet" style="max-width:420px"><div class="bd"><p id="cMsg" style="margin:6px 0 14px"></p><div class="btnRow"><button id="cNo">キャンセル</button><button class="primary" id="cYes">OK</button></div></div></div></div>

<div id="pdfv"><div class="bar"><b id="pvName"></b><span id="pvPage"></span><button id="pvOut" aria-label="縮小">－</button><button id="pvFit">幅</button><button id="pvIn" aria-label="拡大">＋</button><button id="pvClose">閉じる</button></div><div id="pvScroll"><div id="pvPages"></div></div></div>
<div id="viewer"><button class="x" id="vClose">閉じる</button><img id="vImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========== utils ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const m = /^(\d{1,2})[:：](\d{2})$/.exec(String(t||'').trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const fmtMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const hasGeo = s => Number.isFinite(+s.lat) && Number.isFinite(+s.lng) && s.lat !== '' && s.lat !== null && s.lng !== '' && s.lng !== null;
function dist(a, b) { // meters
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? `${Math.round(m)}m` : `${(m/1000).toFixed(m < 10000 ? 1 : 0)}km`;
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function confirmBox(msg) {
  return new Promise(res => {
    $('#cMsg').textContent = msg; openModal('mConfirm');
    const done = v => { closeModal('mConfirm'); $('#cYes').onclick = $('#cNo').onclick = null; res(v); };
    $('#cYes').onclick = () => done(true); $('#cNo').onclick = () => done(false);
  });
}
function openModal(id) { $('#' + id).classList.add('show'); }
function closeModal(id) { $('#' + id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m && m.id !== 'mEdit') closeModal(m.id); });
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(m.id));
});

/* ========== schema ==========
 project: { id, title, date, tel, station, notes, updatedAt, stops[] }
 stop:    { id, time, dur, kind, block, title, cuts, costume, note, place, lat, lng, memo, images[], done, doneAt, doneBy }
   kind: in|loc|shoot|move|break|end|other ／ time空欄＝直前と同じ枠 */
const KINDS = { '': '', in: 'IN', loc: '現場入り', shoot: '撮影', move: '移動', break: '休憩', end: '終了', other: 'その他' };
function normStop(s) {
  const n = v => (v === undefined || v === null) ? '' : v;
  return { id: s.id || uid(), time: n(s.time), dur: n(s.dur), kind: n(s.kind), block: n(s.block), title: n(s.title), cuts: n(s.cuts), costume: n(s.costume),
    note: n(s.note), place: n(s.place), lat: (s.lat === '' || s.lat === null || s.lat === undefined) ? '' : +s.lat, lng: (s.lng === '' || s.lng === null || s.lng === undefined) ? '' : +s.lng,
    memo: n(s.memo), images: Array.isArray(s.images) ? s.images : [], logs: Array.isArray(s.logs) ? s.logs : [], done: !!s.done, doneAt: s.doneAt || null, doneBy: n(s.doneBy) };
}

/* ========== storage ========== */
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('locomap', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const get = async k => { const db = await open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
  const set = async (k, v) => { const db = await open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); };
  return { get, set };
})();
let cfg = { url: '', key: '', me: '', tiles: 'liberty', nav: 'google', projectId: '', recent: [] };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('locomap.cfg') || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem('locomap.cfg', JSON.stringify(cfg)); } catch (e) {} };

/* ========== state ========== */
let P = null;            // project
let editMode = false;
let myPos = null;        // {lat,lng,acc}
let follow = false;

function demoProject() {
  const s = (time, title, place, lat, lng, memo='') => ({ id: uid(), time, title, place, lat, lng, memo, images: [], done: false });
  return { id: uid(), title: 'サンプル：都内ロケ', date: todayStr(), updatedAt: Date.now(), stops: [

async function saveLocal() {

/* ========== images ========== */
const imgCache = new Map();
async function putImage(dataURL) {
  const id = 'im' + uid();
  await idb.set('img:' + id, dataURL);
  imgCache.set(id, dataURL);
  return id;
}
async function getImage(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  let d = await idb.get('img:' + id);
  if (!d && sync.on()) {
    try { const j = await sync.get({ action: 'img', id }); d = j.data; if (d) { await idb.set('img:' + id, d); await markUploaded(id); } } catch (e) {}
  }
  if (d) imgCache.set(id, d);
  return d || null;
}
function fileToDataURL(file, max = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { const c = canvasResize(im, im.naturalWidth, im.naturalHeight, max); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    im.onerror = rej; im.src = url;
  });
}
function canvasResize(src, w, h, max) {
  const k = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0, c.width, c.height); return c;
}
async function hydrateImgs(root) {

/* ========== sync (Google Apps Script) ========== */
const sync = {
  on: () => !!cfg.url,
  async get(params) {
    const u = new URL(cfg.url);
    Object.entries({ ...params, key: cfg.key || '' }).forEach(([k, v]) => u.searchParams.set(k, v));
    const r = await fetch(u.toString()); const j = await r.json(); if (j.error) throw new Error(j.error); return j;
  },
  async post(body) {
    const r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key: cfg.key || '' }) });
    const j = await r.json(); if (j.error) throw new Error(j.error); return j;
  }
};
function setSync(state, msg) { const d = $('#syncDot'); d.className = state || ''; d.title = msg || ''; }
async function uploadedSet() { return new Set(await idb.get('uploaded') || []); }
async function markUploaded(id) { const s = await uploadedSet(); s.add(id); await idb.set('uploaded', [...s]); }
async function uploadImages() {
  const up = await uploadedSet();
  for (const s of P.stops) for (const id of s.images || []) {
    if (up.has(id)) continue;
    const d = await idb.get('img:' + id); if (!d) continue;
    await sync.post({ action: 'img_put', id, data: d }); await markUploaded(id);
  }
}
let pushing = false, pendingPush = false;
async function pushProject() {
  P.updatedAt = Date.now(); await saveLocal();
  if (!sync.on()) return;
  if (pushing) { pendingPush = true; return; }
  pushing = true; setSync('busy', '送信中');
  try {
    await uploadImages();
    const j = await sync.post({ action: 'save', project: P });
    if (j.project) { P = j.project; await saveLocal(); render(); }
    setSync('ok', '同期済み ' + hm(Date.now()));
  } catch (e) { setSync('err', '同期エラー: ' + e.message); toast('同期に失敗しました（端末には保存済み）'); }
  pushing = false;
  if (pendingPush) { pendingPush = false; pushProject(); }
}
async function pull(force) {
  if (!sync.on() || !P || pushing) return;
  try {
    const j = await sync.get({ action: 'get', project: P.id });
    if (!j.project) { await pushProject(); return; }
    if (force || (j.project.updatedAt || 0) > (P.updatedAt || 0)) {
      P = j.project; reapplyOutbox(); await saveLocal(); render();
    }
    if (outbox.length) flushOutbox(); else setSync('ok', '同期済み ' + hm(Date.now()));
  } catch (e) { setSync('err', '同期エラー: ' + e.message); }
}
async function setDone(stop, done) {
  await act({ action: 'done', stopId: stop.id, done, doneAt: done ? Date.now() : null, by: done ? (cfg.me || '') : '' });
}
/* 進捗・現場メモは「送信待ち」に積んでから送る（圏外でも消えず、電波回復後に自動送信） */
let outbox = [];
const saveOutbox = () => idb.set('outbox', outbox);
function applyAction(p, a) {
  const s = p.stops.find(x => x.id === a.stopId); if (!s) return;
  if (a.action === 'done') { s.done = a.done; s.doneAt = a.doneAt; s.doneBy = a.by; }
  if (a.action === 'log') { s.logs = s.logs || []; if (!s.logs.some(l => l.id === a.entry.id)) s.logs.push(a.entry); }
  if (a.action === 'log_del') s.logs = (s.logs || []).filter(l => l.id !== a.entryId);
}
const reapplyOutbox = () => outbox.forEach(a => a.project === P.id && applyAction(P, a));
async function act(a) {
  a = { ...a, project: P.id };
  applyAction(P, a); P.updatedAt = Date.now(); await saveLocal(); render();
  if (!sync.on()) return;
  outbox.push(a); await saveOutbox(); flushOutbox();
}
let flushing = false;
async function flushOutbox() {
  if (flushing || !sync.on() || !outbox.length) return;
  flushing = true; setSync('busy', '送信中');
  while (outbox.length) {
    let j;
    try { j = await sync.post(outbox[0]); }
    catch (e) {
      if (e instanceof TypeError) { setSync('err', `未送信 ${outbox.length}件（電波が戻ると自動で送信）`); flushing = false; return; } // 通信できない
      j = {}; // サーバーが受け付けない（削除済みの項目など）→ 破棄
    }
    outbox.shift(); await saveOutbox();
    if (j.project && j.project.id === P.id) { P = j.project; reapplyOutbox(); await saveLocal(); render(); }
  }
  setSync('ok', '同期済み ' + hm(Date.now())); flushing = false;
}
window.addEventListener('online', () => flushOutbox());

/* GPS */
let watchId = null, meMarker = null, accCircle = null;
function startGps() {
  if (!('geolocation' in navigator)) { toast('この端末では位置情報が使えません'); return; }
  if (watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(p => {
    myPos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    if (!meMarker) {
      meMarker = L.marker([myPos.lat, myPos.lng], { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000 }).addTo(layerMe);
      accCircle = L.circle([myPos.lat, myPos.lng], { radius: myPos.acc, color: '#1a73e8', weight: 1, fillOpacity: .08 }).addTo(layerMe);
      map.setView([myPos.lat, myPos.lng], Math.max(map.getZoom(), 15));
    } else { meMarker.setLatLng([myPos.lat, myPos.lng]); accCircle.setLatLng([myPos.lat, myPos.lng]).setRadius(myPos.acc); }
    if (follow) map.panTo([myPos.lat, myPos.lng]);
    renderStatus(); drawMap(computeState());
  }, err => {
    if (err.code === 1) { toast('位置情報が許可されていません（設定 > プライバシー > 位置情報サービス）'); navigator.geolocation.clearWatch(watchId); watchId = null; follow = false; $('#btnGps').classList.remove('on'); }
    else if (!myPos) toast('位置情報を取得中…（電波状況を確認してください）');
  },
  { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
$('#btnGps').onclick = () => {
  startGps(); follow = !follow || !myPos; $('#btnGps').classList.toggle('on', follow);
  if (myPos) map.setView([myPos.lat, myPos.lng], Math.max(map.getZoom(), 16));
};

/* ========== progress logic ========== */
function computeState() {
  const stops = P.stops;
  const ai = stops.findIndex(s => !s.done);
  const active = ai >= 0 ? stops[ai] : null;
  const next = ai >= 0 ? stops.slice(ai + 1).find(s => !s.done) || null : null;
  return { active, ai, next };
}
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function timing(st) {
  const s = st.active; if (!s) return null;
  const { start, end, inBlock } = blockOf(st.ai);
  const n = nowMin(), pre = inBlock ? `${fmtMin(start)}〜の枠 ` : '';
  if (start === null) return { cls: '', text: '時刻未設定' };
  if (n < start) return { cls: 'wait', text: `${pre}開始まで ${start - n}分` };
  if (end !== null && n < end) return { cls: 'on', text: `${pre}予定内 残り${end - n}分` };
  if (end !== null) return { cls: 'late', text: `${pre}予定終了を ${n - end}分超過` };
  return { cls: 'on', text: `開始から ${n - start}分` };
}

// 時刻が空欄の地点は、直前の時刻付き地点と同じ時間枠として扱う
function blockOf(idx) {
  let si = idx; while (si >= 0 && toMin(P.stops[si].time) === null) si--;
  const start = si >= 0 ? toMin(P.stops[si].time) : null;
  const nxt = P.stops.slice(idx + 1).find(x => toMin(x.time) !== null);
  return { start, end: nxt ? toMin(nxt.time) : null, inBlock: si !== idx && si >= 0 };
}

function detailGo(d) {

  const ta = $('#dLog'); if (ta && ta.value.trim()) { toast('入力中のメモがあります。追加するか消してから移動してください'); return; }
  detailId = P.stops[j].id; renderDetail(d); $('#dBody').scrollTop = 0;

}
$('#dPrev').onclick = () => detailGo(-1);
$('#dNext').onclick = () => detailGo(1);
(() => { // 左右スワイプ
  let sx = 0, sy = 0, ok = false;
  const sheet = $('#mDetail .sheet');
  sheet.addEventListener('touchstart', e => {
    ok = e.touches.length === 1 && !e.target.closest('.imgs,textarea,input,a,button');
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (!ok) return; ok = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;

})();

$('#eSave').onclick = () => {

function parseCoords(t) {
  t = String(t || '');
  const pats = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /[?&](?:q|ll|query|destination|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i, /^\s*(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{2,3}\.\d+)\s*$/];
  for (const p of pats) { const m = p.exec(t); if (m) return { lat: +m[1], lng: +m[2] }; }
  return null;
}
async function geocode(q) {
  const out = [];
  try { // 国土地理院 住所検索
    const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
    const j = await r.json();
    (j || []).slice(0, 5).forEach(f => out.push({ name: f.properties.title, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] }));
  } catch (e) {}
  try { // OSM Nominatim（施設名向け）
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&accept-language=ja&limit=5&q=' + encodeURIComponent(q));
    const j = await r.json();
    (j || []).forEach(f => out.push({ name: f.display_name, lat: +f.lat, lng: +f.lon }));
  } catch (e) {}
  return out;
}

async function drawPage() {
  const pg = await pdfDoc.getPage(pdfPage), c = $('#pCanvas'); if (!c) return;
  const base = pg.getViewport({ scale: 1 });
  const scale = Math.min(4, 2400 / Math.max(base.width, base.height));
  const vp = pg.getViewport({ scale });
  c.width = vp.width; c.height = vp.height;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  await pg.render({ canvasContext: g, viewport: vp }).promise;
  crop = null; $('#pRect').style.display = 'none';

function setupCrop() {
  const wrap = $('#pCrop'), rect = $('#pRect'); let st = null;
  const pos = e => { const r = wrap.getBoundingClientRect(); return { x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)) }; };
  wrap.onpointerdown = e => { st = pos(e); wrap.setPointerCapture(e.pointerId); rect.style.display = 'none'; crop = null; };
  wrap.onpointermove = e => {
    if (!st) return; const p = pos(e);
    const x = Math.min(st.x, p.x), y = Math.min(st.y, p.y), w = Math.abs(p.x - st.x), h = Math.abs(p.y - st.y);
    Object.assign(rect.style, { display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    crop = { x, y, w, h };
  };
  wrap.onpointerup = wrap.onpointercancel = () => { st = null; if (crop && (crop.w < 8 || crop.h < 8)) { crop = null; rect.style.display = 'none'; } };
}
async function addCrop() {
  const c = $('#pCanvas'); const k = c.width / c.clientWidth;
  const r = crop ? { x: crop.x * k, y: crop.y * k, w: crop.w * k, h: crop.h * k } : { x: 0, y: 0, w: c.width, h: c.height };
  const o = document.createElement('canvas'); o.width = Math.round(r.w); o.height = Math.round(r.h);
  o.getContext('2d').drawImage(c, r.x, r.y, r.w, r.h, 0, 0, o.width, o.height);
  const dataURL = canvasResize(o, o.width, o.height, 1800).toDataURL('image/jpeg', 0.85);
  const id = await putImage(dataURL);
  const tv = $('#pTarget').value;
  if (tv === '__draft' || (pdfTarget && tv === pdfTarget.id && draft === pdfTarget)) {
    pdfTarget.images.push(id); closeModal('mPdf'); renderEdit(); openModal('mEdit'); toast('画像を添付しました（保存で確定）'); return;
  }
  const s = P.stops.find(x => x.id === tv); if (!s) return;

}
async function scanDrafts() {
  drafts = [];

    const pg = await pdfDoc.getPage(n); const tc = await pg.getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 4); if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, s: it.str });
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => {
      const line = r.items.sort((a, b) => a.x - b.x).map(i => i.s.trim()).join(' ').replace(/\s+/g, ' ').trim();
      const m = /(\d{1,2})\s*[:：]\s*(\d{2})/.exec(line); if (!m) return;
      const h = +m[1], mi = +m[2]; if (h > 29 || mi > 59) return;
      let rest = (line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length))
        .replace(/[〜~～\-－–]\s*\d{1,2}\s*[:：]\s*\d{2}/g, '').replace(/\d{1,2}\s*[:：]\s*\d{2}/g, '').replace(/^[\s〜~～\-－–]+/, '').replace(/\s+/g, ' ').trim();
      drafts.push({ on: true, time: fmtMin(h * 60 + mi), title: rest.slice(0, 60), page: n, raw: line });
    });
  }
  const box = $('#pDrafts');
  if (!drafts.length) { box.innerHTML = '<div class="hint">時刻を含む行が見つかりませんでした。香盤表が画像として貼り込まれたPDF（Excelをスクショして貼った場合など）は文字を読めません。手順3で香盤表を切り抜いて添付するか、JSONで読み込んでください。</div>'; return; }
  box.innerHTML = `<div class="hint">${drafts.length}行を検出。不要な行のチェックを外し、タイトルを整えてから追加してください。場所・座標は追加後に各地点の「編集」で設定します。</div>` +
    drafts.map((d, k) => `<div class="draft"><input type="checkbox" data-k="${k}" checked><div style="flex:1"><div style="display:flex;gap:6px"><input type="text" data-t="${k}" value="${esc(d.time)}" style="width:80px;flex:none"><input type="text" data-n="${k}" value="${esc(d.title)}"></div><div class="hint">p.${d.page}：${esc(d.raw)}</div></div></div>`).join('') +
    `<div class="btnRow"><button class="primary" id="pDraftAdd">チェックした行を地点として追加</button></div>`;
  box.querySelectorAll('[data-k]').forEach(el => el.onchange = () => drafts[+el.dataset.k].on = el.checked);
  box.querySelectorAll('[data-t]').forEach(el => el.oninput = () => drafts[+el.dataset.t].time = el.value);
  box.querySelectorAll('[data-n]').forEach(el => el.oninput = () => drafts[+el.dataset.n].title = el.value);
  $('#pDraftAdd').onclick = async () => {
    const add = drafts.filter(d => d.on);
    if (P.stops.length && !(await confirmBox(`既存の${P.stops.length}地点の後ろに${add.length}地点を追加します。よろしいですか？`))) return;
    add.forEach(d => P.stops.push({ id: uid(), time: d.time, title: d.title, place: '', lat: '', lng: '', memo: '', images: [], done: false }));
    render(); pushProject(); renderPdf(); toast(`${add.length}地点を追加しました`);
  };
}

/* ========== 香盤表PDF（登録・取得・ビューア） ========== */
const CHUNK = 3 * 1024 * 1024; // base64 文字数で分割して送受信
function bufToB64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBuf(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
async function setProjectPdf(file) {
  const buf = await file.arrayBuffer(); const id = 'pdf' + uid();
  try { await (pdfOpen(buf.slice(0))); } catch (e) { throw new Error('PDFとして開けません'); }
  await idb.set('pdfb:' + id, buf);
  if (sync.on()) {
    const b64 = bufToB64(buf), total = Math.max(1, Math.ceil(b64.length / CHUNK));
    for (let i = 0; i < total; i++) { toast(`PDFを送信中 ${i + 1}/${total}`); await sync.post({ action: 'blob_put', id, part: i, total, name: file.name, size: buf.byteLength, data: b64.slice(i * CHUNK, (i + 1) * CHUNK) }); }
  }
  P.pdf = { id, name: file.name, size: buf.byteLength }; render(); await pushProject();
}
async function getPdfBytes(onProgress) {
  if (!P.pdf) return null;
  let b = await idb.get('pdfb:' + P.pdf.id); if (b) return b;
  if (!sync.on()) return null;
  const m = await sync.get({ action: 'blob_meta', id: P.pdf.id }); if (!m.meta) return null;
  let s = '';
  for (let i = 0; i < m.meta.total; i++) { onProgress && onProgress(i, m.meta.total); const j = await sync.get({ action: 'blob_part', id: P.pdf.id, part: i }); if (!j.data) return null; s += j.data; }
  b = b64ToBuf(s); await idb.set('pdfb:' + P.pdf.id, b); return b;
}
const PV = { doc: null, id: null, sizes: [], els: [], zoom: 1, drawn: new Map(), obs: null, busy: new Set() };
const pvKey = () => 'locomap.pv.' + PV.id;
function pvSave() { if (!PV.id || !PV.ready) return; try { localStorage.setItem(pvKey(), JSON.stringify({ ...pvPos(), zoom: PV.zoom })); } catch (e) {} }
function pvLoad() { try { return JSON.parse(localStorage.getItem(pvKey()) || 'null'); } catch (e) { return null; } }
function pvPos() {
  const sc = $('#pvScroll'), y = sc.scrollTop; let page = 0;
  for (let i = 0; i < PV.els.length; i++) { if (PV.els[i].offsetTop <= y + 1) page = i; else break; }
  const el = PV.els[page]; const off = el ? Math.max(0, Math.min(1, (y - el.offsetTop) / el.offsetHeight)) : 0;
  const sx = sc.scrollWidth > sc.clientWidth ? sc.scrollLeft / (sc.scrollWidth - sc.clientWidth) : 0;
  return { page, off, sx };
}
function pvRestore(pos) {
  const sc = $('#pvScroll'); if (!pos || !PV.els[pos.page]) { sc.scrollTop = 0; return; }
  const el = PV.els[pos.page]; sc.scrollTop = el.offsetTop + (pos.off || 0) * el.offsetHeight;
  sc.scrollLeft = (pos.sx || 0) * Math.max(0, sc.scrollWidth - sc.clientWidth);
}
function pvLayout() {
  const W = $('#pvScroll').clientWidth - 16;
  PV.els.forEach((el, i) => { const [w, h] = PV.sizes[i]; const cw = W * PV.zoom; el.style.width = cw + 'px'; el.style.height = (cw * h / w) + 'px'; });
  PV.drawn.clear(); PV.els.forEach((el, i) => { if (el.dataset.vis === '1') pvDraw(i); });
}
async function pvDraw(i) {
  const el = PV.els[i]; const target = Math.min(3000, Math.round(el.clientWidth * Math.min(3, (window.devicePixelRatio || 1))));
  if (PV.drawn.get(i) === target || PV.busy.has(i)) return;
  PV.busy.add(i);
  try {
    const pg = await PV.doc.getPage(i + 1); const base = pg.getViewport({ scale: 1 }); const vp = pg.getViewport({ scale: target / base.width });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    el.replaceChildren(c); PV.drawn.set(i, target);
  } catch (e) {}
  PV.busy.delete(i);
  if (PV.drawn.get(i) !== Math.min(3000, Math.round(el.clientWidth * Math.min(3, (window.devicePixelRatio || 1)))) && el.dataset.vis === '1') pvDraw(i);
}
function pvSetZoom(z) {
  const pos = pvPos(); PV.zoom = Math.max(0.5, Math.min(5, z)); pvLayout(); pvRestore(pos); pvSave(); pvIndicator();
}
function pvIndicator() { if (PV.els.length) $('#pvPage').textContent = `${pvPos().page + 1} / ${PV.els.length}`; }
async function openPdfViewer() {
  if (!P.pdf) return;
  PV.ready = false; // 位置を復元するまで保存しない
  $('#pdfv').classList.add('show'); $('#pvName').textContent = P.pdf.name;
  const box = $('#pvPages');
  if (PV.id !== P.pdf.id || !PV.doc) {
    box.style.transform = ''; box.innerHTML = '<div class="pvMsg">読み込み中…</div>'; $('#pvPage').textContent = '';
    let buf = null;
    try { buf = await getPdfBytes((i, n) => box.innerHTML = `<div class="pvMsg">ダウンロード中… ${i + 1}/${n}</div>`); } catch (e) {}
    if (!buf) { box.innerHTML = '<div class="pvMsg">PDFを取得できませんでした。電波の状況を確認して、もう一度開いてください。</div>'; return; }
    PV.doc = await pdfOpen(buf.slice(0)); PV.id = P.pdf.id; PV.sizes = [];
    for (let n = 1; n <= PV.doc.numPages; n++) { const v = (await PV.doc.getPage(n)).getViewport({ scale: 1 }); PV.sizes.push([v.width, v.height]); }
    box.innerHTML = ''; PV.els = PV.sizes.map(() => { const d = document.createElement('div'); d.className = 'pvPage'; box.appendChild(d); return d; });
    PV.obs && PV.obs.disconnect();
    PV.obs = new IntersectionObserver(es => es.forEach(e => { const i = PV.els.indexOf(e.target); e.target.dataset.vis = e.isIntersecting ? '1' : ''; if (e.isIntersecting) pvDraw(i); }), { root: $('#pvScroll'), rootMargin: '100% 0px' });
    PV.els.forEach(el => PV.obs.observe(el));
  }
  const st = pvLoad(); PV.zoom = st?.zoom || 1;
  requestAnimationFrame(() => { pvLayout(); pvRestore(st); pvIndicator(); PV.ready = true; });
}
function closePdfViewer() { pvSave(); PV.ready = false; $('#pdfv').classList.remove('show'); }
$('#btnPdf').onclick = openPdfViewer;
$('#pvClose').onclick = closePdfViewer;
$('#pvIn').onclick = () => pvSetZoom(PV.zoom * 1.25);
$('#pvOut').onclick = () => pvSetZoom(PV.zoom / 1.25);
$('#pvFit').onclick = () => pvSetZoom(1);
let pvT = null;
$('#pvScroll').addEventListener('scroll', () => { if (pvT) return; pvT = setTimeout(() => { pvT = null; pvIndicator(); pvSave(); }, 250); }, { passive: true });
// ピンチ操作（iPhone/iPad の Safari）
let pvZ0 = 1;
$('#pvScroll').addEventListener('gesturestart', e => { e.preventDefault(); pvZ0 = PV.zoom; }, { passive: false });
$('#pvScroll').addEventListener('gesturechange', e => { e.preventDefault(); $('#pvPages').style.transform = `scale(${Math.max(0.5, Math.min(5, pvZ0 * e.scale)) / PV.zoom})`; }, { passive: false });
$('#pvScroll').addEventListener('gestureend', e => { e.preventDefault(); $('#pvPages').style.transform = ''; pvSetZoom(pvZ0 * e.scale); }, { passive: false });
// PC：Ctrl+ホイール
$('#pvScroll').addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); pvSetZoom(PV.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive: false });
window.addEventListener('resize', () => { if ($('#pdfv').classList.contains('show')) { const pos = pvPos(); pvLayout(); pvRestore(pos); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pvSave(); });

/* ========== settings ========== */
function shareLink() {
  const payload = { u: cfg.url, k: cfg.key, p: P.id };
  return location.origin + location.pathname + '#join=' + btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/=+$/, '');
}
function openSettings() {
  const b = $('#sBody');
  b.innerHTML = `
    <div class="section"><h4>プロジェクト</h4>
      <label>作品名・案件名</label><input id="sTitle" value="${esc(P.title)}">
      <label>撮影日</label><input id="sDate" type="date" value="${esc(P.date)}">
      <label>自分の名前（完了チェックの記録に使用）</label><input id="sMe" value="${esc(cfg.me)}" placeholder="例：演出部 山田">
      <div class="btnRow"><button class="primary" id="sSaveP">保存</button></div>
      <label>香盤表PDF（ヘッダーの「香盤表」ボタンで開く）</label>
      <div class="subl" style="margin-bottom:6px">${P.pdf ? esc(P.pdf.name) + '（' + (P.pdf.size / 1048576).toFixed(1) + 'MB）' : '未登録'}</div>
      <div class="btnRow"><label class="btn" style="margin:0;font-size:15px;color:inherit;cursor:pointer">${P.pdf ? '差し替え' : 'PDFを登録'}<input id="sPdf" type="file" accept="application/pdf" hidden></label>${P.pdf ? '<button id="sPdfDel">登録を外す</button>' : ''}</div>
    </div>
    <div class="section"><h4>共有（Google Apps Script）</h4>
      <label>Web アプリ URL</label><input id="sUrl" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec">
      <label>合言葉（スクリプト側と同じもの）</label><input id="sKey" value="${esc(cfg.key)}">
      <div class="btnRow"><button id="sConn">接続して同期</button><button id="sOff">共有を解除</button></div>
      <label>共有リンクで参加（ホーム画面のアプリで使う場合はここに貼り付け）</label>
      <div style="display:flex;gap:6px"><input id="sJoin" placeholder="https://…#join=…"><button id="sJoinBtn" style="flex:none">参加</button></div>
      ${sync.on() ? `<label>スタッフ用の共有リンク</label><input id="sLink" readonly value="${esc(shareLink())}"><div class="btnRow"><button id="sCopy">リンクをコピー</button></div>
      <div class="hint">このリンクを開くと、同じプロジェクトに自動で参加します。合言葉が含まれるため、関係者以外に送らないでください。</div>` : '<div class="hint">未設定の場合、データはこの端末内だけに保存されます。</div>'}
    </div>
    <div class="section"><h4>PCで編集</h4><div class="hint">表形式で香盤表を編集できます（PCのブラウザ推奨）。</div><div class="btnRow"><a class="btn" href="editor.html">編集画面を開く</a></div></div>
    <div class="section"><h4>表示</h4>
      <label>地図</label><select id="sTiles">${Object.entries(TILES).map(([k, t]) => `<option value="${k}" ${cfg.tiles === k ? 'selected' : ''}>${t.name}</option>`).join('')}</select>
      <label>ナビに使うアプリ</label><select id="sNav"><option value="google" ${cfg.nav !== 'apple' ? 'selected' : ''}>Google マップ</option><option value="apple" ${cfg.nav === 'apple' ? 'selected' : ''}>Apple マップ</option></select>
    </div>
    <div class="section"><h4>データ</h4>
      <div class="btnRow"><button id="sExport">JSONを書き出し</button><label class="btn" style="margin:0;font-size:15px;color:inherit;cursor:pointer">JSONを読み込み<input id="sImport" type="file" accept="application/json,.json" hidden></label></div>
      <div class="btnRow"><button id="sReset">全地点を未完了に戻す</button></div>
      <div class="btnRow"><button id="sNew">新規プロジェクト</button><button id="sDemo">サンプルを開く</button></div>
      ${(cfg.recent || []).length > 1 ? `<label>最近のプロジェクト</label><select id="sRecent"><option value="">選択…</option>${cfg.recent.filter(r => r.id !== P.id).map(r => `<option value="${esc(r.id)}">${esc(r.date)} ${esc(r.title)}</option>`).join('')}</select>` : ''}
      <div class="hint">プロジェクトID：${esc(P.id)}</div>
    </div>`;
  $('#sPdf').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { await setProjectPdf(f); toast('香盤表PDFを登録しました'); openSettings(); } catch (err) { toast('PDFを登録できません：' + err.message); } };
  const pdel = $('#sPdfDel'); if (pdel) pdel.onclick = async () => { if (!(await confirmBox('香盤表PDFの登録を外しますか？'))) return; P.pdf = null; render(); await pushProject(); openSettings(); };
  $('#sSaveP').onclick = () => { P.title = $('#sTitle').value.trim(); P.date = $('#sDate').value; cfg.me = $('#sMe').value.trim(); saveCfg(); render(); pushProject(); toast('保存しました'); };
  $('#sConn').onclick = async () => {
    cfg.url = $('#sUrl').value.trim(); cfg.key = $('#sKey').value.trim(); saveCfg();
    if (!cfg.url) return;
    setSync('busy');
    try { const j = await sync.get({ action: 'get', project: P.id }); if (j.project) { P = j.project; await saveLocal(); render(); } else await pushProject(); setSync('ok', '同期済み'); toast('接続しました'); openSettings(); startPolling(); }
    catch (e) { setSync('err', e.message); toast('接続できません：' + e.message); }
  };
  $('#sOff').onclick = () => { cfg.url = ''; saveCfg(); setSync(''); render(); openSettings(); };
  $('#sJoinBtn').onclick = async () => { const ok = await joinFromHash($('#sJoin').value); if (ok) { closeModal('mSet'); startPolling(); } };
  const cp = $('#sCopy'); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText($('#sLink').value); toast('コピーしました'); } catch (e) { $('#sLink').select(); toast('選択した状態です。手動でコピーしてください'); } };
  $('#sTiles').onchange = e => { cfg.tiles = e.target.value; saveCfg(); setTiles(); };
  $('#sNav').onchange = e => { cfg.nav = e.target.value; saveCfg(); render(); };
  $('#sExport').onclick = () => {
    const blob = new Blob([JSON.stringify({ title: P.title, date: P.date, stops: P.stops.map(({ id, time, title, place, lat, lng, memo }) => ({ id, time, title, place, lat, lng, memo })) }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${P.date || 'project'}_${P.title || 'locomap'}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#sImport').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); if (!Array.isArray(j.stops)) throw new Error('stops がありません');
      if (!(await confirmBox(`「${j.title || '無題'}」(${j.stops.length}地点) を新しいプロジェクトとして読み込みますか？`))) return;
      const seen = new Map(); // 同じ画像は1回だけ保存
      const putOnce = d => { if (!seen.has(d)) seen.set(d, putImage(d)); return seen.get(d); };
      await switchProject({ id: uid(), title: j.title || '無題', date: j.date || todayStr(), tel: j.tel || '', station: j.station || '', notes: j.notes || '', updatedAt: Date.now(),
        stops: await Promise.all(j.stops.map(async s => ({ ...normStop({ ...s, id: undefined, done: false }),
          images: await Promise.all((s.images || []).filter(d => typeof d === 'string' && d.startsWith('data:image/')).map(putOnce)) }))) });
      closeModal('mSet'); pushProject(); toast('読み込みました');
    } catch (err) { toast('読み込めません：' + err.message); }
  };
  $('#sReset').onclick = async () => { if (!(await confirmBox('全地点の完了チェックを外します。よろしいですか？'))) return; P.stops.forEach(s => { s.done = false; s.doneAt = null; s.doneBy = ''; }); render(); pushProject(); };
  $('#sNew').onclick = async () => { if (!(await confirmBox('空の新規プロジェクトを作成しますか？（現在のものは「最近のプロジェクト」から開けます）'))) return; await switchProject({ id: uid(), title: '新規プロジェクト', date: todayStr(), updatedAt: Date.now(), stops: [] }); openSettings(); pushProject(); };
  $('#sDemo').onclick = async () => { await switchProject(demoProject()); closeModal('mSet'); };
  const rc = $('#sRecent'); if (rc) rc.onchange = async e => { if (!e.target.value) return; const p = await idb.get('project:' + e.target.value); if (p) { await switchProject(p); closeModal('mSet'); pull(true); } };
  openModal('mSet');
}
$('#btnSettings').onclick = openSettings;
async function switchProject(p) { P = p; pdfDoc = null; fittedFor = null; await saveLocal(); render(); }

/* ========== boot ========== */
async function joinFromHash(text) {
  const m = /#join=([A-Za-z0-9+/_-]+)/.exec(String(text || ''));
  if (!m) { toast('共有リンクを読み取れませんでした'); return false; }
  try {
    const j = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
    cfg.url = j.u || ''; cfg.key = j.k || ''; cfg.projectId = j.p; saveCfg();
    P = (await idb.get('project:' + j.p)) || { id: j.p, title: '読み込み中…', date: '', updatedAt: 0, stops: [] };
    fittedFor = null; render(); await pull(true); toast('共有プロジェクトに参加しました'); return true;
  } catch (e) { toast('共有リンクを読み取れませんでした'); return false; }
}
let pollT = null;
function startPolling() { clearInterval(pollT); if (sync.on()) pollT = setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 15000); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
(async function boot() {
  try { outbox = (await idb.get('outbox')) || []; } catch (e) {}
  // join link
  if (/#join=/.test(location.hash)) { await joinFromHash(location.hash); history.replaceState(null, '', location.pathname); }
  if (!P && cfg.projectId) P = await idb.get('project:' + cfg.projectId);
  if (!P) { P = demoProject(); await saveLocal(); }
  render();
  if (sync.on()) { setSync('busy'); await pull(); startPolling(); }
  if (navigator.permissions?.query) { try { const st = await navigator.permissions.query({ name: 'geolocation' }); if (st.state === 'granted') startGps(); } catch (e) {} }
})();
</script>
